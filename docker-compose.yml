services:
  # Service 1: Authentication service container
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: paper-trading-auth
    restart: always
    env_file:
      - ./auth-service/.env
    environment:
      - TRADING_SERVICE_URL=http://trading-service:5102

  # Service 2: Trading service container
  trading-service:
    build:
      context: ./trading-service
      dockerfile: Dockerfile
    container_name: paper-trading-trading
    restart: always
    ports:
      - "5102:5102"
    env_file:
      - ./trading-service/.env

  # Service 3: API Gateway container
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: paper-trading-gateway
    restart: always
    ports:
      - "5100:5100"
    env_file:
      - ./api-gateway/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5101
      - TRADING_SERVICE_URL=http://trading-service:5102
    depends_on:
      - auth-service
      - trading-service

